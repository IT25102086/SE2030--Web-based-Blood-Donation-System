server.port=8089
spring.thymeleaf.cache=false

# Admin Credentials
admin.username=admin
admin.password=admin123

# =============================================
# SQL Server Database Configuration
# =============================================
# SQL Server is listening on TCP port 1433. Using the explicit port avoids the
# SQL Browser dependency required when connecting through a named instance.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Blood_Connect;encrypt=true;trustServerCertificate=true;integratedSecurity=true;loginTimeout=10;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Jackson - LocalDateTime serialization
spring.jackson.serialization.write-dates-as-timestamps=false
