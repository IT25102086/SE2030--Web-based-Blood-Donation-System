<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Delivery Coordination')}"></head><body><nav th:replace="~{layout :: navbar('admin')}"></nav><main class="main-wrapper"><div class="card" style="display:flex;gap:12px"><a class="btn btn-secondary" th:href="@{/admin/dashboard}">Dashboard</a><a class="btn btn-secondary" th:href="@{/admin/inventory}">Inventory & QA</a><a class="btn btn-primary" th:href="@{/admin/deliveries}">Deliveries</a></div><div th:replace="~{layout :: alerts}"></div><h1>Delivery Coordination</h1><section class="card"><h2 class="card-title">Schedule approved request</h2><p th:if="${#lists.isEmpty(approvedRequests)}">No approved requests are awaiting dispatch.</p><form th:unless="${#lists.isEmpty(approvedRequests)}" method="post" th:action="@{/admin/deliveries}" style="display:grid;gap:12px"><select name="requestId" required><option th:each="r:${approvedRequests}" th:value="${r.id}" th:text="${r.patientName + ' — ' + r.bloodGroup + ' (' + r.units + ' units)'}"></option></select><input name="courierName" placeholder="Courier name" required><input name="vehicleNumber" placeholder="Vehicle number" required><input name="scheduledAt" type="datetime-local" required><input name="notes" placeholder="Route / handover notes"><button class="btn btn-primary">Schedule dispatch</button></form></section><section class="card"><h2 class="card-title">Delivery orders</h2><div class="table-responsive"><table><thead><tr><th>Request</th><th>Courier / vehicle</th><th>Schedule</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="d:${deliveries}"><td th:text="${d.request.patientName}"></td><td th:text="${d.courierName + ' / ' + d.vehicleNumber}"></td><td th:text="${#temporals.format(d.scheduledAt,'dd MMM yyyy HH:mm')}"></td><td th:text="${d.status}"></td><td><form th:if="${d.status == 'Scheduled'}" th:action="@{/admin/deliveries/{id}/status(id=${d.id})}" method="post"><input type="hidden" name="status" value="Delivered"><button class="btn btn-primary btn-sm">Confirm safe delivery</button></form></td></tr></tbody></table></div></section></main><footer th:replace="~{layout :: footer}"></footer></body></html>
