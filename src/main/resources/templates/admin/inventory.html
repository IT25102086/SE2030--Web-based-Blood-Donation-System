<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Inventory & QA')}"></head><body>
<nav th:replace="~{layout :: navbar('admin')}"></nav><main class="main-wrapper">
<div class="card" style="padding:16px;margin-bottom:24px;display:flex;gap:12px;flex-wrap:wrap"><a th:href="@{/admin/dashboard}" class="btn btn-secondary">Dashboard</a><a th:href="@{/admin/donors}" class="btn btn-secondary">Donors</a><a th:href="@{/admin/requests}" class="btn btn-secondary">Requests</a><a th:href="@{/admin/inventory}" class="btn btn-primary">Inventory & QA</a><a th:href="@{/admin/logout}" class="btn btn-secondary" style="margin-left:auto">Logout</a></div>
<div th:replace="~{layout :: alerts}"></div><h1>Blood Inventory & Quality Verification</h1><p>Register units, record mandatory screening, and release only safe unexpired stock.</p>
<div class="form-row" style="grid-template-columns: minmax(280px, .8fr) minmax(400px, 1.2fr)"><section class="card"><h2 class="card-title">Add collected blood unit</h2><form th:action="@{/admin/inventory}" method="post" th:object="${newUnit}"><div class="form-group"><label>Blood group</label><select th:field="*{bloodGroup}" required><option value="">Select</option><option th:each="g : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }" th:value="${g}" th:text="${g}"></option></select></div><div class="form-group"><label>Component</label><select th:field="*{component}"><option value="Whole Blood">Whole Blood</option><option value="Plasma">Plasma</option><option value="Platelets">Platelets</option><option value="Red Cells">Red Cells</option></select></div><div class="form-group"><label>Branch</label><input th:field="*{branch}" required></div><div class="form-group"><label>Expiry date/time</label><input type="datetime-local" th:field="*{expiresAt}" required></div><button class="btn btn-primary">Add for QA screening</button></form></section>
<section class="card"><h2 class="card-title">Stock overview</h2><div class="table-responsive"><table><thead><tr><th>Group</th><th>Component / Branch</th><th>Expiry</th><th>Quality status</th><th>QA action</th></tr></thead><tbody><tr th:each="unit : ${units}"><td><span class="blood-badge" th:text="${unit.bloodGroup}"></span></td><td><span th:text="${unit.component}"></span><br><small th:text="${unit.branch}"></small></td><td th:text="${#temporals.format(unit.expiresAt, 'dd MMM yyyy HH:mm')}"></td><td th:text="${unit.status}"></td><td><form th:if="${unit.status == 'Pending Screening'}" th:action="@{/admin/inventory/{id}/screening(id=${unit.id})}" method="post" style="display:grid;grid-template-columns:repeat(2,auto);gap:4px;font-size:.8rem"><label><input type="checkbox" name="hiv" value="true" required> HIV non-reactive</label><label><input type="checkbox" name="hepB" value="true" required> Hep B non-reactive</label><label><input type="checkbox" name="hepC" value="true" required> Hep C non-reactive</label><label><input type="checkbox" name="syphilis" value="true" required> Syphilis non-reactive</label><label><input type="checkbox" name="malaria" value="true" required> Malaria non-reactive</label><input name="notes" placeholder="QA notes"><button class="btn btn-primary btn-sm">Save screening</button></form><span th:unless="${unit.status == 'Pending Screening'}">Recorded</span></td></tr></tbody></table></div></section></div>
</main><footer th:replace="~{layout :: footer}"></footer></body></html>
