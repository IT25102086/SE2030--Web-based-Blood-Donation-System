<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" fill="none">
  <defs>
    <linearGradient id="cyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="cyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0e254e" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="30" y="30" width="460" height="380" rx="28" fill="url(#cyBg)"/>
  
  <!-- Main Medical Checklist Card -->
  <g transform="translate(100, 60)" filter="url(#cyShadow)">
    <rect x="0" y="0" width="320" height="320" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Clipboard top clip -->
    <rect x="110" y="-14" width="100" height="28" rx="8" fill="#0e254e"/>
    <circle cx="160" cy="0" r="5" fill="#ffffff"/>

    <!-- Checklist header -->
    <text x="30" y="46" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#0e254e">Donor Criteria Checklist</text>
    <line x1="30" y1="58" x2="290" y2="58" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Item 1: Age 18-60 -->
    <g transform="translate(30, 78)">
      <circle cx="14" cy="14" r="14" fill="#dcfce7"/>
      <path d="M8 14 L12 18 L20 10" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="40" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Age: 18 - 60 Years</text>
      <text x="40" y="27" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">First time donors under 55</text>
    </g>

    <!-- Item 2: Weight > 50kg -->
    <g transform="translate(30, 134)">
      <circle cx="14" cy="14" r="14" fill="#dcfce7"/>
      <path d="M8 14 L12 18 L20 10" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="40" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Weight: Above 50 kg</text>
      <text x="40" y="27" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Healthy Body Mass Index</text>
    </g>

    <!-- Item 3: Interval > 4 months -->
    <g transform="translate(30, 190)">
      <circle cx="14" cy="14" r="14" fill="#dcfce7"/>
      <path d="M8 14 L12 18 L20 10" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="40" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0f172a">4 Months Since Last Donation</text>
      <text x="40" y="27" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Full recovery of red blood cells</text>
    </g>

    <!-- Item 4: Hemoglobin >= 12.5 -->
    <g transform="translate(30, 246)">
      <circle cx="14" cy="14" r="14" fill="#dcfce7"/>
      <path d="M8 14 L12 18 L20 10" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="40" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Hemoglobin: &gt;= 12.5 g/dl</text>
      <text x="40" y="27" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Verified before each donation</text>
    </g>
  </g>
</svg>
