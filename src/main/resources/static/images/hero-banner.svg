<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0e254e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="340" cy="240" r="210" fill="url(#heroBgGrad)" opacity="0.85"/>
  <circle cx="490" cy="110" r="45" fill="#fecaca" opacity="0.6"/>
  <circle cx="160" cy="400" r="60" fill="#e0f2fe" opacity="0.7"/>

  <!-- Pulse Circles -->
  <circle cx="340" cy="240" r="170" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
  <circle cx="340" cy="240" r="130" stroke="#bae6fd" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Floating Floating Red Blood Cells -->
  <g opacity="0.85">
    <ellipse cx="140" cy="120" rx="20" ry="14" transform="rotate(-15 140 120)" fill="url(#redGrad)"/>
    <ellipse cx="140" cy="120" rx="10" ry="6" transform="rotate(-15 140 120)" fill="#f87171" opacity="0.6"/>
    <ellipse cx="500" cy="380" rx="24" ry="16" transform="rotate(25 500 380)" fill="url(#redGrad)"/>
    <ellipse cx="500" cy="380" rx="12" ry="7" transform="rotate(25 500 380)" fill="#f87171" opacity="0.6"/>
    <ellipse cx="460" cy="70" rx="14" ry="10" transform="rotate(45 460 70)" fill="url(#redGrad)" opacity="0.7"/>
    <ellipse cx="180" cy="310" rx="16" ry="11" transform="rotate(-30 180 310)" fill="url(#redGrad)" opacity="0.7"/>
  </g>

  <!-- Main Central Illustrated Card / Stand -->
  <g filter="url(#heroShadow)">
    <!-- Base Clinic Recliner / Pod -->
    <rect x="180" y="110" width="310" height="340" rx="24" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Top Card Header Accent -->
    <path d="M180 134 C180 120.75 190.75 110 204 110 H466 C479.25 110 490 120.75 490 134 V160 H180 Z" fill="#0e254e"/>
    <circle cx="210" cy="135" r="5" fill="#ef4444"/>
    <circle cx="226" cy="135" r="5" fill="#f59e0b"/>
    <circle cx="242" cy="135" r="5" fill="#10b981"/>
    <text x="270" y="140" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="0.5">National Blood Donor Network</text>

    <!-- Transfusion IV Stand & Bag -->
    <rect x="230" y="180" width="6" height="230" rx="3" fill="#cbd5e1"/>
    <path d="M210 190 H256" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Blood Bag hanging -->
    <g transform="translate(236, 192)">
      <rect x="0" y="8" width="52" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="4" y="24" width="44" height="52" rx="8" fill="url(#redGrad)"/>
      <!-- Liquid wave reflection -->
      <path d="M4 32 Q26 26 48 32 V76 H4 Z" fill="#991b1b" opacity="0.4"/>
      <!-- Label on bag -->
      <rect x="12" y="38" width="28" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="18" y="52" font-family="'Poppins', sans-serif" font-size="13" font-weight="800" fill="#dc2626">O+</text>
      <!-- Tube coming out -->
      <path d="M26 82 C26 120 180 120 180 180" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Doctor / Donor Avatar Graphic -->
    <g transform="translate(315, 200)">
      <!-- Donor Chair -->
      <path d="M-10 160 C-10 110 50 100 80 110 C120 120 130 180 130 200 H-20 Z" fill="#e2e8f0" opacity="0.7"/>
      <!-- Person Stethoscope / Heart Badge -->
      <circle cx="55" cy="45" r="28" fill="#fdba74"/>
      <!-- Hair -->
      <path d="M30 40 C30 20 80 20 80 40 C75 25 40 25 30 40 Z" fill="#1e293b"/>
      <!-- Torso Doctor / Donor coat -->
      <path d="M20 74 C20 74 38 68 55 68 C72 68 90 74 90 74 L98 150 H12 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Blue Scrub shirt underneath -->
      <path d="M44 68 L55 92 L66 68 Z" fill="#0284c7"/>
      <!-- Stethoscope -->
      <path d="M42 74 C42 105 68 105 68 74" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="55" cy="110" r="6" fill="#64748b"/>
      <path d="M55 104 V116" stroke="#ffffff" stroke-width="2"/>
      <!-- Bandaged Arm giving blood with thumb up -->
      <path d="M20 90 L-10 120 C-15 125 -10 135 0 135 L20 115" fill="#fdba74"/>
      <rect x="-6" y="118" width="16" height="12" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
      <path d="M2 120 V128 M-2 124 H6" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Floating Badge 1: 100% Free & Safe -->
    <g transform="translate(140, 240)" filter="url(#heroShadow)">
      <rect x="0" y="0" width="145" height="54" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="28" cy="27" r="16" fill="#dcfce7"/>
      <!-- Checkmark -->
      <path d="M21 27 L26 32 L35 22" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="24" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Safe &amp; Sterile</text>
      <text x="52" y="38" font-family="'Roboto', sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified Blood Bank</text>
    </g>

    <!-- Floating Badge 2: 1 Donation = 3 Lives -->
    <g transform="translate(370, 370)" filter="url(#heroShadow)">
      <rect x="0" y="0" width="165" height="56" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="16" fill="#fee2e2"/>
      <!-- Heart -->
      <path d="M28 35 L21 28 C18 25 18 20 22 18 C25 17 27 19 28 21 C29 19 31 17 34 18 C38 20 38 25 35 28 Z" fill="#dc2626"/>
      <text x="52" y="24" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#991b1b">1 Bag = 3 Lives</text>
      <text x="52" y="40" font-family="'Roboto', sans-serif" font-size="10" font-weight="500" fill="#64748b">RBC, Platelets, Plasma</text>
    </g>
  </g>

  <!-- ECG Line across bottom -->
  <path d="M60 470 H180 L195 440 L210 500 L225 455 L240 480 L255 470 H540" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
